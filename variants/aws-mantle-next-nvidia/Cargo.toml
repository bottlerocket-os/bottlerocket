[package]
name = "aws-mantle-next-nvidia"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[package.metadata.build-variant.image-features]
grub-set-private-var = true
uefi-secure-boot = true
xfs-data-partition = true
systemd-networkd = true
erofs-root-partition = true
external-kmod-development = false
encrypted-storage = true
ephemeral-encryption-keys = true
in-place-updates = false

[package.metadata.build-variant.image-layout]
os-image-size-gib = 4

[package.metadata.build-variant]
# The aarch64 build of this variant is aws-mantle-next-64k-nvidia.
supported-arches = ["x86_64"]
image-format = "uki"
included-packages = [
# core
    "release",
    "kernel-6.18",
    "containerd-2.3",
    "systemd-257",
    "nftables",
    "whippet",
    "aws-signer-notation-plugin",
    "digestion-image-verifier",
    "notation-image-verifier",
    "thar-be-image-verifiers",
# NVIDIA support
    "nvidia-container-toolkit-ecs",
    "kmod-6.18-nvidia-r620-tesla",
    "kmod-6.18-nvidia-r620-gdrcopy",
    "kmod-6.18-nvidia-r620-imex-config",
    # Fabric manager and NVLSM, for HGX systems with NVSwitch such as p7-r.
    "kmod-6.18-nvidia-r620-fabricmanager",
]

kernel-parameters = [
    "console=tty0",
    "console=ttyS0,115200n8",
    "net.ifnames=0",
    "netdog.default-interface=eth0:dhcp4,dhcp6?",
    "quiet",
    # No nvidia.NVreg_CoherentGPUMemoryMode=driver here. It applies only to
    # Grace and Vera class platforms, where the CPU and GPU share coherent
    # memory. x86_64 hosts reach the GPU over PCIe and have no coherent memory.
]

[lib]
path = "../variants.rs"

[build-dependencies]
settings-defaults = { path = "../../packages/settings-defaults" }
settings-plugins = { path = "../../packages/settings-plugins" }
settings-migrations = { path = "../../packages/settings-migrations" }
