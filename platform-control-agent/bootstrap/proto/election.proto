syntax = "proto3";

package platform.bootstrap.election.v1alpha1;

import "google/protobuf/timestamp.proto";

// Election service for leader election during cluster bootstrap
service ElectionService {
  // Get current leader information
  rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);
  
  // Campaign to become leader
  rpc Campaign(CampaignRequest) returns (CampaignResponse);
  
  // Resign from leadership
  rpc Resign(ResignRequest) returns (ResignResponse);
  
  // Stream election events
  rpc ObserveElection(ObserveRequest) returns (stream ElectionEvent);
  
  // Internal: Handle vote request
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  
  // Internal: Handle heartbeat
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Get current leader
message GetLeaderRequest {}

message GetLeaderResponse {
  string leader_id = 1;
  int64 term = 2;
  google.protobuf.Timestamp last_heartbeat = 3;
  bool is_leader = 4;  // True if this node is the leader
  ElectionState state = 5;
}

// Campaign for leadership
message CampaignRequest {
  bool force = 1;  // Force campaign even if leader exists
}

message CampaignResponse {
  bool success = 1;
  string reason = 2;
  int64 term = 3;
}

// Resign from leadership
message ResignRequest {}

message ResignResponse {
  bool success = 1;
  string new_leader = 2;  // If known
}

// Observe election events
message ObserveRequest {
  bool include_heartbeats = 1;  // Include heartbeat events
}

// Election state
message ElectionState {
  string node_id = 1;
  int64 term = 2;
  NodeState state = 3;
  string leader_id = 4;
  repeated string cluster_members = 5;
  PriorityScore priority = 6;
  google.protobuf.Timestamp last_heartbeat = 7;
}

// Node states in election
enum NodeState {
  NODE_STATE_UNKNOWN = 0;
  NODE_STATE_FOLLOWER = 1;
  NODE_STATE_CANDIDATE = 2;
  NODE_STATE_LEADER = 3;
}

// Priority score for leader election
message PriorityScore {
  uint64 base_score = 1;
  uint64 stability_bonus = 2;
  uint64 resource_bonus = 3;
  uint64 user_priority = 4;
  uint64 total = 5;
}

// Vote request (internal)
message VoteRequest {
  string candidate_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  PriorityScore priority = 5;
  bytes pre_vote_proof = 6;  // For pre-vote phase
}

// Vote response (internal)
message VoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
  string reason = 3;
  bytes signature = 4;
}

// Heartbeat from leader (internal)
message HeartbeatRequest {
  string leader_id = 1;
  int64 term = 2;
  int64 commit_index = 3;
  google.protobuf.Timestamp lease_expiry = 4;
}

message HeartbeatResponse {
  int64 term = 1;
  bool success = 2;
}

// Election events
message ElectionEvent {
  google.protobuf.Timestamp timestamp = 1;
  ElectionEventType type = 2;
  string node_id = 3;
  int64 term = 4;
  
  // Event-specific data
  oneof data {
    StateChangeData state_change = 10;
    LeaderChangeData leader_change = 11;
    VoteData vote = 12;
    HeartbeatData heartbeat = 13;
  }
}

enum ElectionEventType {
  ELECTION_EVENT_TYPE_UNKNOWN = 0;
  ELECTION_EVENT_TYPE_STATE_CHANGE = 1;
  ELECTION_EVENT_TYPE_LEADER_CHANGE = 2;
  ELECTION_EVENT_TYPE_VOTE_CAST = 3;
  ELECTION_EVENT_TYPE_VOTE_RECEIVED = 4;
  ELECTION_EVENT_TYPE_HEARTBEAT = 5;
  ELECTION_EVENT_TYPE_TIMEOUT = 6;
}

message StateChangeData {
  NodeState old_state = 1;
  NodeState new_state = 2;
  string reason = 3;
}

message LeaderChangeData {
  string previous_leader = 1;
  string new_leader = 2;
  string reason = 3;
}

message VoteData {
  string from_node = 1;
  string to_node = 2;
  bool granted = 3;
  string reason = 4;
}

message HeartbeatData {
  string from_leader = 1;
  google.protobuf.Timestamp lease_expiry = 2;
}