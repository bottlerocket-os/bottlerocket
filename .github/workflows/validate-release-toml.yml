name: Validate Release.toml

on:
  pull_request:
    paths:
      - 'Release.toml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Release.toml
        run: ./tools/validate-release-toml
